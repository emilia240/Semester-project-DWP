; PHP settings for this folder (read by PHP when it runs as FastCGI, which is how Simply.com runs it).
; Without them many hosts allow only 2 MB per upload, which is too small for a phone photo.
; Our own limit is 5 MB per picture (ImageUploader::MAX_FILE_BYTES) and at most 7 pictures per post.
upload_max_filesize = 6M
post_max_size = 40M
max_file_uploads = 20
